[project]
name = "siab"
version = "0.1.0"
description = "Python arm of the SIAB_DuckDB preparation: polars over DuckDB"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.18",
    "duckdb>=1.1",
    "pyarrow>=18",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["siab"]

[tool.pytest.ini_options]
testpaths = ["../tests/pytest"]
